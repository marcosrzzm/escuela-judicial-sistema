<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escuela Judicial · Prototipo interactivo</title><style>
:root{--gold:#a98a4a;--ink:#252627;--paper:#faf8f4;--muted:#797979;--line:#e8e2d8;--pale:#f2ece2}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:15px system-ui,-apple-system,Segoe UI,sans-serif;color:#252525}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{width:255px;flex-shrink:0;background:#242526;color:#fff;padding:28px 17px;display:flex;flex-direction:column;gap:25px}.seal{font:52px Georgia,serif;color:#c5ab72;border:2px solid #9f864e;border-radius:50%;width:73px;height:73px;display:grid;place-items:center;margin:auto}.brand{text-align:center;font:18px Georgia,serif;letter-spacing:2px}.brand small{display:block;font:10px system-ui;margin-top:6px;letter-spacing:1px;color:#cecece}.nav{display:grid;gap:7px}.nav button{border:0;border-radius:8px;background:transparent;color:#ddd;text-align:left;padding:13px 14px}.nav button.active,.nav button:hover{background:#9c8047;color:#fff}.notice{margin-top:auto;border-top:1px solid #6b5d43;padding-top:18px;font-size:12px;color:#d6c9ae;line-height:1.5}.main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:22px 36px;background:#fff;border-bottom:1px solid var(--line)}.top strong{font:19px Georgia,serif}.top small{color:#777}.top select{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.content{padding:35px;max-width:1480px;margin:auto}h1{font:39px Georgia,serif;margin:0 0 8px}h2{font:25px Georgia,serif;margin:0 0 18px}p.sub{color:#777;margin:0 0 28px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0;flex-wrap:wrap}.btn{border:1px solid #d8cdb8;background:white;border-radius:8px;padding:10px 16px;color:#333}.btn.primary{background:#9f834b;border-color:#9f834b;color:white}.btn.danger{color:#9a3730;border-color:#d9b4af}.btn:disabled{opacity:.48;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0}.card,.panel{background:white;border:1px solid var(--line);box-shadow:0 3px 18px #1c160908;border-radius:13px;padding:22px}.stat{font:37px Georgia,serif;margin:10px 0}.muted{color:#777;font-size:13px}.panel{margin:20px 0;overflow:auto}.grid2{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{border-bottom:1px solid #eee;padding:14px;text-align:left;font-size:13px}th{background:#f6f3ef;font-weight:600;color:#625c51}tr:last-child td{border:0}.tag{padding:6px 9px;border-radius:7px;font-size:12px;background:#edf3ec;color:#347044;white-space:nowrap}.tag.warn{background:#fff1dd;color:#91620d}.tag.red{background:#fdeae8;color:#a04437}.field{display:grid;gap:6px;margin:12px 0}.field input,.field select,.field textarea,.grade{border:1px solid #ded6cb;border-radius:7px;padding:10px;background:#fff;max-width:100%}.grade{width:75px}.flow{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}.step{padding:13px;border:1px solid #d8c9ad;background:#fff;border-radius:9px;font-size:13px}.hidden{display:none!important}.empty{color:#777;padding:16px}.toast{position:fixed;bottom:22px;right:25px;background:#262626;color:white;padding:15px 22px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}.hint{border-left:3px solid var(--gold);padding:10px 13px;background:#f4efe6;font-size:13px;line-height:1.55;margin:16px 0}.print{display:none}@media(max-width:830px){.layout{display:block}.sidebar{width:100%;padding:14px}.seal,.brand,.notice{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.content{padding:22px}.cards,.grid2{grid-template-columns:1fr}.top{padding:16px;flex-wrap:wrap}h1{font-size:30px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="seal">SJ</div><div class="brand">ESCUELA JUDICIAL<small>SUPREMO TRIBUNAL DE JUSTICIA<br>DEL ESTADO DE JALISCO</small></div><nav class="nav" id="nav"></nav><div class="notice">PROTOTIPO CONCEPTUAL · DEMOSTRACIÓN<br>El monograma «SJ» es ilustrativo, no el sello institucional. Datos completamente ficticios. Sin conexión externa.</div></aside><main class="main"><header class="top"><div><strong>Escuela Judicial</strong><br><small>Gestión académica de Posgrados · Periodo 2026-B</small></div><label>Ver como: <select id="role"><option value="coord">Coordinación de Posgrados</option><option value="teacher">Docente</option><option value="director">Dirección</option><option value="external">Responsable de carga externa</option></select></label></header><div class="content" id="view"></div></main></div><div class="toast" id="toast"></div><script>
const seed=[{id:'EJ-101',name:'Ana Sofía Castillo Rivera',grades:{'Derecho Procesal':9.2},pending:[]},{id:'EJ-102',name:'Carlos Eduardo Medina',grades:{'Derecho Procesal':8.4},pending:['Teoría Jurídica']},{id:'EJ-103',name:'Daniela Torres Gómez',grades:{'Derecho Procesal':9.6},pending:[]},{id:'EJ-104',name:'Fernando López Ríos',grades:{'Derecho Procesal':8.1},pending:[]},{id:'EJ-105',name:'Gabriela Núñez Salazar',grades:{'Derecho Procesal':9.0},pending:[]}];
let state={role:'coord',page:'inicio',students:structuredClone(seed),delivery:{status:'Borrador',version:1,reason:'',grades:{}},evaluation:{'EJ-101':'Con derecho','EJ-102':'Pendiente de revisión','EJ-103':'Con derecho','EJ-104':'Con derecho','EJ-105':'Con derecho'},closed:false,lot:false,received:false,loaded:false,logs:[]};
const navData=[['inicio','Inicio'],['listas','Grupos y listas'],['evaluacion','Derecho a evaluación'],['captura','Calificaciones · Docente'],['revision','Revisión de entregas'],['historial','Historial y pendientes'],['cierre','Cierre y lotes'],['bitacora','Bitácora']];
const perms={coord:['inicio','listas','evaluacion','revision','historial','cierre','bitacora'],teacher:['inicio','listas','captura'],director:['inicio','evaluacion','cierre'],external:['inicio','cierre']};
function log(s){state.logs.unshift({s,at:new Date().toLocaleString('es-MX'),who:document.querySelector('#role').selectedOptions[0].text});}function msg(s){let x=document.getElementById('toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3000)}
function change(page){if(!perms[state.role].includes(page))return msg('Este rol no tiene acceso a esa sección');state.page=page;render()}
function badge(s){return '<span class="tag '+(/Pendiente|Devuelta/.test(s)?'warn':/Rechazada/.test(s)?'red':'')+'">'+s+'</span>'}
function header(t,s){return `<h1>${t}</h1><p class="sub">${s}</p>`}
function tableStudents(extra){return `<table><thead><tr><th>Matrícula</th><th>Alumno</th>${extra||'<th>Grupo</th><th>Estado</th>'}</tr></thead><tbody>${state.students.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td>${extra?extra==='eval'?`<td>${badge(state.evaluation[s.id])}</td>`:`<td>${(s.grades['Derecho Procesal']||'–')}</td>`:`<td>POS-01</td><td>${badge('Vigente')}</td>`}</tr>`).join('')}</tbody></table>`}
function inicio(){return header('Panel de '+(state.role==='teacher'?'Docente':state.role==='director'?'Dirección':state.role==='external'?'Carga externa':'Coordinación'),'Un mismo registro académico, reutilizado con permisos según el rol.')+`<div class="cards"><div class="card"><div class="muted">Alumnos del grupo</div><div class="stat">5</div><div class="muted">Datos ficticios</div></div><div class="card"><div class="muted">Estado de calificaciones</div><div class="stat">${state.delivery.status}</div><div class="muted">Versión ${state.delivery.version}</div></div><div class="card"><div class="muted">Estado del cierre</div><div class="stat">${state.closed?'Cerrado':'Abierto'}</div><div class="muted">Periodo 2026-B</div></div></div><div class="panel"><h2>Flujo del MVP</h2><div class="flow">${['Lista vigente','Decisión humana de evaluación','Entrega docente','Revisión de Coordinación','Historial y pendientes','Cierre y lote','Carga oficial externa'].map(x=>`<span class="step">${x}</span>`).join('')}</div><div class="hint">Haz clic en las secciones del menú y cambia de rol arriba. El prototipo permite editar calificaciones, enviar una entrega, devolverla, aceptarla, registrar el cierre y confirmar la recepción del lote. Nada se envía a una plataforma real.</div></div>`}
function listas(){return header('Grupos y listas vigentes','La lista se reutiliza, sin recapturar nombres entre etapas.')+`<div class="panel"><div class="toolbar"><h2>Posgrados · Grupo POS-01</h2>${badge('Vigente')}</div><div class="muted">Periodo 2026-B · Materia: Derecho Procesal · Docente: Dra. Ana Torres</div><br>${tableStudents()}<div class="toolbar"><span class="muted">Acceso docente: solo su grupo y materia.</span><button class="btn" onclick="msg('Lista vigente consultada (simulación)')">Consultar lista</button></div></div>`}
function evaluacion(){return header('Derecho a evaluación','Coordinación registra una decisión humana; la aplicación no decide automáticamente.')+`<div class="panel"><h2>Revisión por alumno</h2><div class="hint">No incluye captura completa de asistencia ni justificantes. Aquí únicamente se registra el resultado y su motivo, una vez revisado por la persona facultada.</div><table><tr><th>Alumno</th><th>Decisión registrada</th><th>Acción</th></tr>${state.students.map(s=>`<tr><td>${s.name}</td><td>${badge(state.evaluation[s.id])}</td><td>${state.role==='coord'?`<select id="eval-${s.id}"><option>Con derecho</option><option>Sin derecho</option><option>Pendiente de revisión</option></select> <button class="btn" onclick="saveEval('${s.id}')">Guardar</button>`:'Consulta'}</td></tr>`).join('')}</table></div>`}
function saveEval(id){let v=document.getElementById('eval-'+id).value;let why=prompt('Motivo de la decisión (obligatorio):');if(!why?.trim())return msg('Debes registrar un motivo');state.evaluation[id]=v;log(`Derecho a evaluación ${id}: ${v}. Motivo: ${why}`);render();msg('Decisión registrada')}
function captura(){let editing=['Borrador','Devuelta'].includes(state.delivery.status);return header('Captura de calificaciones','Docente: captura únicamente las calificaciones de su grupo asignado.')+`<div class="panel"><div class="toolbar"><h2>Derecho Procesal · POS-01</h2>${badge(state.delivery.status)} <span class="muted">Versión ${state.delivery.version}</span></div>${state.delivery.reason?`<div class="hint"><b>Observación de Coordinación:</b> ${esc(state.delivery.reason)}</div>`:''}<table><tr><th>Matrícula</th><th>Alumno</th><th>Calificación (0 a 10)</th></tr>${state.students.map(s=>`<tr><td>${s.id}</td><td>${s.name}</td><td><input class="grade" type="number" min="0" max="10" step="0.1" id="grade-${s.id}" value="${state.delivery.grades[s.id]??s.grades['Derecho Procesal']}" ${editing?'':'disabled'}></td></tr>`).join('')}</table><div class="toolbar"><span class="muted">Entrega modificable solo en borrador o tras devolución.</span><div><button class="btn" ${editing?'':'disabled'} onclick="saveGrades(false)">Guardar borrador</button> <button class="btn primary" ${editing?'':'disabled'} onclick="saveGrades(true)">Enviar a revisión</button></div></div></div>`}
function saveGrades(submit){let grades={};for(let s of state.students){let v=Number(document.getElementById('grade-'+s.id).value);if(!Number.isFinite(v)||v<0||v>10)return msg('Todas las calificaciones deben estar entre 0 y 10');grades[s.id]=v}state.delivery.grades=grades;if(submit){state.delivery.status='Enviada';log('Docente envió calificaciones v'+state.delivery.version)}else log('Docente guardó borrador de calificaciones');render();msg(submit?'Entrega enviada a Coordinación':'Borrador guardado')}
function revision(){return header('Revisión de calificaciones','Coordinación acepta la entrega o la devuelve indicando el motivo.')+`<div class="panel"><div class="toolbar"><h2>Entrega: POS-01 · Derecho Procesal</h2>${badge(state.delivery.status)}</div><p class="muted">Versión ${state.delivery.version}</p><table><tr><th>Alumno</th><th>Nota entregada</th></tr>${state.students.map(s=>`<tr><td>${s.name}</td><td>${state.delivery.grades[s.id]??'Sin enviar'}</td></tr>`).join('')}</table>${state.delivery.status==='Enviada'?`<div class="field"><label>Motivo de devolución</label><textarea id="reason" rows="3" placeholder="Describe la corrección solicitada..."></textarea></div><div class="toolbar"><button class="btn danger" onclick="review(false)">Devolver al docente</button><button class="btn primary" onclick="review(true)">Aceptar entrega</button></div>`:`<div class="hint">${state.delivery.status==='Borrador'?'Esperando que el docente envíe las calificaciones.':state.delivery.status==='Aceptada'?'Entrega aceptada. Las notas ya forman parte del historial del prototipo.':'Devuelta al docente para corregir y reenviar.'}</div>`}</div>`}
function review(ok){if(ok){state.delivery.status='Aceptada';state.students.forEach(s=>s.grades['Derecho Procesal']=state.delivery.grades[s.id]);log('Coordinación aceptó calificaciones v'+state.delivery.version);msg('Calificaciones aceptadas y reflejadas en historial')}else{let why=document.getElementById('reason').value.trim();if(!why)return msg('Escribe un motivo para devolver');state.delivery.reason=why;state.delivery.status='Devuelta';state.delivery.version++;log('Coordinación devolvió entrega. Motivo: '+why);msg('Entrega devuelta al docente')}render()}
function historial(){return header('Historial y pendientes','Consulta el expediente académico conectado entre periodos.')+`<div class="grid2"><div class="panel"><h2>Calificaciones por alumno</h2>${tableStudents('grades')}<div class="hint">Las notas cambian cuando Coordinación acepta una entrega docente.</div></div><div class="panel"><h2>Pendientes académicos</h2>${state.students.map(s=>`<p><b>${s.name}</b><br><span class="muted">${s.pending.length?s.pending.join(', '):'Sin pendientes registrados'}</span></p>`).join('')}</div></div>`}
function cierre(){return header('Cierre y lote de entrega','El sistema prepara el lote aprobado. La carga a la plataforma oficial ocurre fuera del MVP.')+`<div class="cards"><div class="card">Calificaciones<br><div class="stat">${state.delivery.status}</div></div><div class="card">Cierre<br><div class="stat">${state.closed?'Aprobado':'Pendiente'}</div></div><div class="card">Carga externa<br><div class="stat">${state.loaded?'Registrada':'Pendiente'}</div></div></div><div class="panel"><h2>Acciones del cierre</h2><div class="hint">La firma institucional y la integración automática con la plataforma oficial están fuera del MVP. La aprobación no equivale a firma oficial.</div><div class="toolbar">${state.role==='coord'?`<button class="btn primary" onclick="closePeriod()" ${state.delivery.status==='Aceptada'&&!state.closed?'':'disabled'}>Preparar y aprobar cierre</button><button class="btn" onclick="makeLot()" ${state.closed&&!state.lot?'':'disabled'}>Generar lote</button>`:''}${state.role==='external'?`<button class="btn" ${state.lot&&!state.received?'':'disabled'} onclick="registerReception()">Confirmar recepción</button><button class="btn primary" ${state.received&&!state.loaded?'':'disabled'} onclick="registerLoad()">Registrar carga externa</button>`:''}</div><table><tr><th>Elemento</th><th>Estado</th></tr><tr><td>Cierre de grupo</td><td>${badge(state.closed?'Aprobado':'Pendiente')}</td></tr><tr><td>Lote para área externa</td><td>${badge(state.lot?'Generado':'Pendiente')}</td></tr><tr><td>Recepción del lote</td><td>${badge(state.received?'Confirmada':'Pendiente')}</td></tr><tr><td>Carga en plataforma oficial</td><td>${badge(state.loaded?'Registrada (externa)':'No registrada')}</td></tr></table></div>`}
function closePeriod(){if(state.delivery.status!=='Aceptada')return msg('Primero hay que aceptar la entrega');state.closed=true;log('Coordinación aprobó cierre interno');render();msg('Cierre interno preparado')};function makeLot(){state.lot=true;log('Coordinación generó lote de entrega');render();msg('Lote listo para entrega externa')};function registerReception(){state.received=true;log('Área externa confirmó recepción del lote');render();msg('Recepción confirmada')};function registerLoad(){state.loaded=true;log('Área externa registró que realizó la carga oficial por separado');render();msg('Resultado externo registrado')}
function bitacora(){return header('Bitácora de cambios','Permite rastrear quién hizo qué y cuándo.')+`<div class="panel"><table><tr><th>Fecha</th><th>Usuario / Rol</th><th>Acción</th></tr>${state.logs.length?state.logs.map(l=>`<tr><td>${l.at}</td><td>${l.who}</td><td>${esc(l.s)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">Todavía no hay cambios. Interactúa con el prototipo para generar registros.</td></tr>'}</table></div>`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.getElementById('nav').innerHTML=navData.filter(([id])=>perms[state.role].includes(id)).map(([id,l])=>`<button class="${state.page===id?'active':''}" onclick="change('${id}')">${l}</button>`).join('');document.getElementById('view').innerHTML=({inicio,listas,evaluacion,captura,revision,historial,cierre,bitacora}[state.page]||inicio)()};document.getElementById('role').addEventListener('change',e=>{state.role=e.target.value;state.page='inicio';render()});render();
</script></body></html>
